# One Gitea Actions job per precommit check. Not a single combined job.
#
# act_runner starts a new container per job. Empty images: clone GITHUB_SHA
# with the job token over HTTPS. Gitea git HTTP returns 401 without the token.
# Do not git init or set init.defaultBranch here. Do not use actions/checkout.
name: precommit

"on":
  push:
  pull_request:

concurrency:
  group: precommit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RAILS_ENV: test
  GITHUB_TOKEN: ${{ github.token }}
  BUNDLE_JOBS: "4"
  BUNDLE_RETRY: "3"

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/ruby:4.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RAILS_ENV: test
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates libpq-dev build-essential
      - run: |
          git config --global --add safe.directory '*'
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: bundle install
      - run: bin/rails test

  sast:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/ruby:4.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RAILS_ENV: test
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates libpq-dev build-essential
      - run: |
          git config --global --add safe.directory '*'
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: bundle install
      - run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

  audit:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/ruby:4.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RAILS_ENV: test
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates libpq-dev build-essential
      - run: |
          git config --global --add safe.directory '*'
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: bundle install
      - run: bin/bundler-audit

  gitleaks:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/ruby:4.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates curl
      - run: |
          git config --global --add safe.directory '*'
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version
      - run: gitleaks git --verbose

  style:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/ruby:4.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RAILS_ENV: test
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates libpq-dev build-essential
      - run: |
          git config --global --add safe.directory '*'
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: bundle install
      - run: bin/rubocop
